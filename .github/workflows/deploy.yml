name: Deploy Repertoire 2 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Render PWA and Apple icons from the actual generated laurel-knight artwork
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin
          rsvg-convert -w 32 -h 32 -o dist/favicon-32-v4.png public/brand-knight.svg
          rsvg-convert -w 192 -h 192 -o dist/icon-192-v4.png public/brand-knight.svg
          rsvg-convert -w 512 -h 512 -o dist/icon-512-v4.png public/brand-knight.svg
          rsvg-convert -w 512 -h 512 -o dist/icon-maskable-512-v4.png public/brand-knight.svg
          rsvg-convert -w 180 -h 180 -o dist/apple-touch-icon-v4.png public/brand-knight.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
