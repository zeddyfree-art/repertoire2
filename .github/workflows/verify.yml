name: Verify Repertoire 2
on:
  push:
    branches: [main, 'design/**', 'feature/**']
  pull_request:
    branches: [main]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify generated knight and wordmark render into real PWA icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin
          rsvg-convert -w 32 -h 32 -o dist/favicon-32-v4.png public/brand-knight.svg
          rsvg-convert -w 180 -h 180 -o dist/apple-touch-icon-v4.png public/brand-knight.svg
          rsvg-convert -w 192 -h 192 -o dist/icon-192-v4.png public/brand-knight.svg
          rsvg-convert -w 512 -h 512 -o dist/icon-512-v4.png public/brand-knight.svg
          rsvg-convert -w 512 -h 512 -o dist/icon-maskable-512-v4.png public/brand-knight.svg
          cp dist/favicon-32-v4.png /tmp/repertoire-favicon.png
          cp dist/icon-192-v4.png /tmp/repertoire-knight.png
          rsvg-convert -w 248 -h 77 -o /tmp/repertoire-logo.png public/brand-lockup-v2.svg
          test "$(stat -c%s /tmp/repertoire-favicon.png)" -gt 800
          test "$(stat -c%s /tmp/repertoire-knight.png)" -gt 4000
          test "$(stat -c%s /tmp/repertoire-logo.png)" -gt 2000
      - name: Install Chromium for desktop and phone smoke tests
        run: npx playwright install chromium --only-shell
      - name: Verify Warm Studio navigation, board and themes in Chromium
        run: npx playwright test e2e/studio.spec.ts e2e/workspaces.spec.ts e2e/brand.spec.ts e2e/finish.spec.ts e2e/legacyImport.spec.ts e2e/roundA.spec.ts e2e/roundB.spec.ts e2e/largePgn.spec.ts
