name: Verify Repertoire 2
on:
  push:
    branches: [main, 'design/**', 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify generated knight and wordmark render into real PWA icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin
          rsvg-convert -w 192 -h 192 -o /tmp/repertoire-knight.png public/brand-knight.svg
          rsvg-convert -w 248 -h 77 -o /tmp/repertoire-logo.png public/brand-lockup-v2.svg
          test "$(stat -c%s /tmp/repertoire-knight.png)" -gt 4000
          test "$(stat -c%s /tmp/repertoire-logo.png)" -gt 2000
      - name: Install Chromium for desktop and phone smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify Warm Studio navigation, board and themes in Chromium
        run: npx playwright test e2e/studio.spec.ts e2e/workspaces.spec.ts e2e/brand.spec.ts e2e/finish.spec.ts e2e/legacyImport.spec.ts e2e/uxAudit.spec.ts
