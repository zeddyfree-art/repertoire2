name: Verify Repertoire 2
on:
  push:
    branches: [main, 'design/**', 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for desktop and phone smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify Warm Studio navigation, board and themes in Chromium
        run: npx playwright test e2e/studio.spec.ts
